<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Shop Perfumes | Folle</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <link rel="stylesheet" href="style.css">

    <script src="script.js" defer></script>

</head>

<body data-page="shop">

<div id="sharedHeader"></div>

<main>

    <section class="page-hero compact-page-hero">

        <img
            src="images/shop-hero.jpg"
            alt="Folle perfume collection"
            class="page-hero-image"
        >

        <div class="page-hero-overlay"></div>

        <div class="container page-hero-copy reveal">

            <span class="eyebrow">
                THE COLLECTION
            </span>

            <h1>
                Find your
                <em>signature scent.</em>
            </h1>

            <p>
                Search Folle's collection by fragrance style,
                gender and personality.
            </p>

        </div>

    </section>



    <section class="section">

        <div class="container">

            <div class="filter-toolbar reveal">

                <div class="filter-chips">

                    <button class="filter-chip active" data-filter="all">
                        All
                    </button>

                    <button class="filter-chip" data-filter="top">
                        Top Sellers
                    </button>

                    <button class="filter-chip" data-filter="men">
                        Men
                    </button>

                    <button class="filter-chip" data-filter="women">
                        Women
                    </button>

                    <button class="filter-chip" data-filter="unisex">
                        Unisex
                    </button>

                    <button class="filter-chip" data-filter="fresh">
                        Fresh
                    </button>

                    <button class="filter-chip" data-filter="floral">
                        Floral
                    </button>

                    <button class="filter-chip" data-filter="woody">
                        Woody
                    </button>

                    <button class="filter-chip" data-filter="oriental">
                        Oriental
                    </button>

                </div>


                <input
                    id="productSearch"
                    class="product-search"
                    type="search"
                    placeholder="Search fragrances..."
                >

            </div>


            <div class="catalogue-meta">

                <span>
                    Showing
                    <strong id="visibleCount">0</strong>
                    fragrances
                </span>

                <button id="resetFilters" class="reset-button">
                    Reset
                </button>

            </div>


            <div
                class="product-grid"
                id="productGrid"
                data-product-collection="all"
            ></div>


            <div id="emptyState" class="empty-state">

                <h3>No fragrances match your search.</h3>

                <button id="emptyReset" class="btn btn-dark">
                    Show All
                </button>

            </div>

        </div>

    </section>

</main>

<div id="sharedFooter"></div>
<div id="sharedOverlays"></div>

</body>
</html>
